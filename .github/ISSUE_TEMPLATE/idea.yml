name: Idea
description: Something Narrari could do, or do better.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do and where Narrari got in the way. One idea per issue.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would solve it
