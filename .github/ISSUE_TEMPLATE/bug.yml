name: Bug
description: Something Narrari does wrong.
labels: [bug]
body:
  - type: textarea
    id: did
    attributes:
      label: What you did
      description: The steps, in order. Leave out anything you dictated or anything said in a meeting.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of narrari doctor
      description: It never shows dictated text, meeting content or service keys. It does name your microphones and speakers, so read it before you paste it.
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines, if they help
      description: "`narrari logs --last 30m` around the time it went wrong."
      render: text
